{% extends "base.html" %}
{% block title %}Login · SecureAuth{% endblock %}
{% block content %}
<div class="card">
  <h1>Welcome back</h1>
  <p class="muted">Sign in to your account</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert-success">{{ success }}</div>{% endif %}
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <div class="pw-wrap">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">👁️</button>
    </div>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p class="foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
